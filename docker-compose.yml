version: "3"
services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  gateway:
    build:
      context: .
      dockerfile: Dockerfile_gateway
    container_name: gateway
    depends_on:
      cars:
        condition: service_healthy
      payments:
        condition: service_healthy 
      rentals:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Services__Cars: "http://cars:8080"
      Services__Payments: "http://payments:8080"
      Services__Rentals: "http://rentals:8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/manage/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  
  cars:
    build:
      context: .
      dockerfile: Dockerfile_cars
    container_name: cars
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__PostgresConnection: "Host=postgres;Port=5432;Database=cars;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8070:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/manage/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
      
  rentals:
    build:
      context: .
      dockerfile: Dockerfile_rentals
    container_name: rentals
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__PostgresConnection: "Host=postgres;Port=5432;Database=rentals;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8060:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/manage/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  
  payments:
    build:
      context: .
      dockerfile: Dockerfile_payments
    container_name: payments
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__PostgresConnection: "Host=postgres;Port=5432;Database=payments;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8050:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/manage/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

# TODO добавить сервисы

volumes:
  db-data: